name: Build Universal APK (Actions)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Encrypt translator.html
      shell: pwsh
      run: ./encrypt_translator.ps1

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Bookstore-APK-debug
        path: app/build/outputs/apk/debug/Bookstore-*.apk
        retention-days: 7
